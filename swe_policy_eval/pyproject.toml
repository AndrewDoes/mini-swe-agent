[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-policy-eval"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["mini-swe-agent>=2.4", "swebench>=4.0", "datasets", "pyyaml", "numpy", "python-dotenv", "pytest"]

[tool.setuptools.packages.find]
where = ["src"]
